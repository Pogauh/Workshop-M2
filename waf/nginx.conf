# =====================================================================================================
#  WAF léger : peau du système immunitaire (nginx, aucun module externe)
#  Monté dans l'image nginx-unprivileged comme conf.d/default.conf (donc au niveau « http »).
#
#  Couches, de la plus grossière à la plus fine :
#    1. méthodes, tailles, délais        -> coupe les clients lents et les verbes inutiles
#    2. signatures (URI / User-Agent)    -> sqli, xss, traversal, cmdi, scanner : 403 + règle journalisée
#    3. bannissement dynamique ($banned) -> écrit par le moteur de remédiation (rules/active.conf)
#    4. débits :  pay  = PAR JETON (clé $rl_key)  | login = par IP | glob = disjoncteur global par IP
#    5. routage en liste blanche : /auth/login, /api/*, et le reste vers l'interface web
#  Le corps JSON n'est pas inspecté ici (pas de Lua) : il est validé strictement par l'API (pydantic + SQL paramétré).
# =====================================================================================================

# --- règles dynamiques : geo $banned + zones « pay » et « login » (fichier réécrit par le moteur) ---
# La clé de débit est définie AVANT l'inclusion : le jeton identifie l'utilisateur même derrière le NAT de Docker Desktop.
map $http_authorization $rl_key {
    default  $binary_remote_addr;
    "~^Bearer [A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]{10,}$"  $http_authorization;
}
include /etc/nginx/rules/active.conf;

limit_req_zone  $binary_remote_addr  zone=glob:10m  rate=400r/s;   # disjoncteur : couvre les jetons forgés en rafale
limit_req_zone  $binary_remote_addr  zone=face:10m  rate=10r/s;    # reconnaissance faciale : rythme humain (caméra), pas de paiement
limit_conn_zone $binary_remote_addr  zone=conn:10m;
limit_req_log_level  warn;
limit_conn_log_level warn;
error_log /dev/stderr error;

# --- signatures : un nom de règle par famille, remonté dans les journaux (SIEM, règle R1) ---
map $request_uri $waf_sig {
    default "";
    "~*union(\s|\+|%20|/\*.*?\*/)+(all(\s|\+|%20)+)?select"                                              sqli;
    "~*(%27|')(\s|\+|%20)*(or|and)(\s|\+|%20)+(%27|')?[0-9a-z_]+(%27|')?(\s|\+|%20)*(=|%3d|like)"        sqli;
    "~*(sleep|benchmark|pg_sleep|waitfor(\s|\+|%20)+delay)(\s|\+|%20)*(\(|%28)"                          sqli;
    "~*(information_schema|pg_catalog|pg_user|sqlite_master)"                                            sqli;
    "~*(;|%3b)(\s|\+|%20)*(drop|delete|insert|update|alter|truncate)(\s|\+|%20)"                         sqli;
    "~*(%27|')(\s|\+|%20)*(--|%2d%2d|#|%23|/\*)"                                                         sqli;
    "~*(<|%3c)(\s|\+|%20)*(/|%2f)?(script|img|svg|iframe|object|embed|body|link)"                        xss;
    "~*(javascript|vbscript):"                                                                           xss;
    "~*[^a-z]on(error|load|click|mouseover)(\s|\+|%20)*="                                                xss;
    "~*(\.\./|\.\.%2f|%2e%2e(/|%2f|%5c)|\.\.%5c)"                                                        traversal;
    "~*(/etc/(passwd|shadow)|/proc/self|boot\.ini|win\.ini)"                                             traversal;
    "~*(;|%3b|\||%7c|&&|%26%26|`|%60)(\s|\+|%20)*(cat|ls|id|whoami|wget|curl|nc|bash|sh|powershell)(\s|\+|%20|;)"  cmdi;
    "~*([$]|%24)(\{|%7b)(jndi|env|sys)"                                                                  cmdi;
}
map $http_user_agent $waf_ua {
    default "";
    "~*(sqlmap|nikto|nmap|masscan|nessus|acunetix|wpscan|dirbuster|gobuster|feroxbuster|havij)"          scanner;
}

log_format immune escape=json
  '{"t":"$time_iso8601","ip":"$remote_addr","method":"$request_method","uri":"$uri","status":$status,'
  '"rt":$request_time,"banned":"$banned","rule":"$waf_rule"}';

server {
    listen 8080;
    server_tokens off;
    access_log /dev/stdout immune;                 # remplace le journal « main » hérité : une seule ligne JSON par requête
    resolver 127.0.0.11 valid=5s ipv6=off;         # DNS Docker : l'adresse d'un service redémarré est retrouvée

    client_max_body_size 8k;
    client_header_timeout 5s;  client_body_timeout 5s;  send_timeout 10s;  keepalive_timeout 15s;
    limit_conn conn 400;       limit_conn_status 429;
    limit_req_status 429;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'" always;

    # --- 1 + 2 + 3 : méthodes, signatures, bannissement ---
    set $waf_rule $waf_sig$waf_ua;
    if ($request_method !~ ^(GET|POST|HEAD|OPTIONS)$) { set $waf_rule method; return 405; }
    if ($banned)       { set $waf_rule banned; return 403; }
    if ($waf_rule)     { return 403; }

    error_page 403 @blocked;
    error_page 429 @throttled;
    error_page 502 503 504 @down;
    location @blocked   { default_type application/json; return 403 '{"detail":"Requête bloquée par le pare-feu applicatif"}'; }
    location @throttled { default_type application/json; add_header Retry-After 1 always; return 429 '{"detail":"Trop de requêtes, réessayez dans un instant"}'; }
    location @down      { default_type application/json; return 503 '{"detail":"Service momentanément indisponible, reprise en cours"}'; }

    location = /waf-health { access_log off; default_type text/plain; return 200 "ok"; }

    # --- 4 + 5 : routage en liste blanche ---
    location = /auth/login {
        limit_req zone=login burst=10 nodelay;
        set $auth http://auth:8001;
        proxy_pass $auth;
        include /etc/nginx/proxy.conf;
        proxy_connect_timeout 2s; proxy_read_timeout 5s;
    }
    location = /api/health/deep { return 404; }    # contrôle interne (base + invariant comptable), jamais exposé
    location /face/ {                              # reconnaissance faciale (consigne additionnelle 1) : images en JSON/base64
        limit_req zone=face burst=5 nodelay;
        client_max_body_size 16m;                  # jusqu'à 20 photos d'inscription en base64 ; largement > un simple /verify
        set $face http://face:8600;
        proxy_pass $face;
        include /etc/nginx/proxy.conf;
        proxy_connect_timeout 2s; proxy_read_timeout 10s;
    }
    location /api/ {
        limit_req zone=pay  burst=30  nodelay;     # un jeton = un seau
        limit_req zone=glob burst=200 nodelay;     # disjoncteur global par IP
        set $api http://api:8000;
        proxy_pass $api;
        include /etc/nginx/proxy.conf;
        proxy_connect_timeout 2s; proxy_read_timeout 10s;
    }
    location / {                                   # interface de paiement (conteneur « web »)
        limit_req zone=glob burst=200 nodelay;
        set $web http://web:8080;
        proxy_pass $web;
        include /etc/nginx/proxy.conf;
        proxy_connect_timeout 2s; proxy_read_timeout 5s;
    }
}
