# En-têtes communs des location proxifiées (include : add_header/proxy_set_header ne s'héritent pas entre niveaux)
proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header X-Forwarded-For $remote_addr;    # écrase la valeur du client : pas d'usurpation d'IP
proxy_set_header Connection "";
proxy_hide_header X-Powered-By;
