server { listen 8080;
  # 240s : marge pour un modèle local à froid (rechargement Ollama ~15-50s + génération, surtout en CPU pur sans
  # l'overlay docker-compose.gpu.yml) ; au-delà, mieux vaut que l'opérateur le sache plutôt qu'un timeout silencieux.
  location = /ask { proxy_pass http://assistant:8500/ask; proxy_read_timeout 240s; proxy_connect_timeout 5s; }
  location / { root /usr/share/nginx/html; try_files $uri /index.html; }
}
