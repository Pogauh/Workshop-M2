; PROJECT RESILIENCE-ALPHA — badge lumineux ESP8266 (LED bicolore rouge/vert)
; IDE imposé par la consigne additionnelle : JetBrains CLion + plugin PlatformIO (ouvrir ce dossier comme projet CLion ;
; CLion détecte platformio.ini automatiquement si le plugin "PlatformIO for CLion" est installé).
; En ligne de commande (si besoin, sans CLion) : pip install platformio && pio run -t upload -t monitor
[env:nodemcuv2]
platform = espressif8266
board = nodemcuv2                  ; NodeMCU v2/v3 (ESP-12E). Même jeu de broches "Dx" que la Wemos D1 Mini (board = d1_mini) si
                                    ; c'est votre matériel : seule cette ligne change, voir docs/esp8266-wiring.md.
framework = arduino
monitor_speed = 115200
lib_deps =
    bblanchon/ArduinoJson@^7.2.0
    ESP8266WebServer

; --- Paramètres réseau et matériel : modifiez ici, pas dans le code (src/config.h les reprend) ---
build_flags =
    -D WIFI_SSID='"RESILIENCE-G1"'          ; nom du point d'accès mobile Windows du PC Hôte (voir README du dépôt)
    -D WIFI_PASSWORD='"changeme-hotspot"'   ; mot de passe du hotspot (celui défini lors de sa création sous Windows)
    -D STATIC_IP='"192.168.137.50"'         ; IP fixe choisie pour le badge, hors de la plage DHCP par défaut de Windows
    -D GATEWAY_IP='"192.168.137.1"'         ; PC Hôte = passerelle du hotspot (adresse imposée par le sujet)
    -D SUBNET_MASK='"255.255.255.0"'
    -D LED_GREEN_PIN=5                      ; D1 = GPIO5
    -D LED_RED_PIN=4                        ; D2 = GPIO4
    -D LED_ACTIVE_LOW=0                     ; 0 = LED a cathode commune (defaut, voir docs/esp8266-wiring.md)
                                             ; 1 = LED a anode commune (bascule electriquement : AUCUN autre changement necessaire)
