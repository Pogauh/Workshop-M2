# Console de supervision (localhost uniquement). Seule la lecture de l'état du moteur est relayée ; aucune action n'est exposée.
server {
    listen 8080;
    server_tokens off;
    resolver 127.0.0.11 valid=5s ipv6=off;
    root /usr/share/nginx/html;

    location = /state {
        limit_except GET { deny all; }
        set $rem http://remediator:9000;
        proxy_pass $rem/state;
        proxy_connect_timeout 2s; proxy_read_timeout 3s;
        add_header Cache-Control "no-store" always;
    }
    location /assets/ { expires 7d; add_header Cache-Control "public, immutable"; }
    location / { try_files $uri /index.html; add_header Cache-Control "no-cache"; }
}
