global: { scrape_interval: 5s }
scrape_configs:
  - job_name: api
    static_configs: [{ targets: ['api:8000'], labels: { service: api } }]
  - job_name: auth
    static_configs: [{ targets: ['auth:8001'], labels: { service: auth } }]
  - job_name: remediator
    static_configs: [{ targets: ['remediator:9000'], labels: { service: remediator } }]
  - job_name: detector
    static_configs: [{ targets: ['detector:9100'], labels: { service: detector } }]
